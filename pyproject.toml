[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "budget-tracker-frontend"
version = "0.1.0"
description = "SSR Frontend BFF for Budget Tracker using Flask, Jinja2, and Clean Architecture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    # Flask needs asgiref to run `async def` view functions under WSGI workers.
    "asgiref>=3.7.0",
    "jinja2>=3.1.2",
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "itsdangerous>=2.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    # The E2E suite drives Playwright directly instead of via pytest-playwright:
    # that plugin wraps every test call, which breaks pytest-asyncio's auto mode
    # when both suites share a session. See tests/e2e/conftest.py.
    "playwright>=1.40.0",
    "ruff>=0.1.0",
    "black>=23.10.0",
    "respx>=0.20.0",
]

[tool.hatch.envs.default]
features = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The domain exception hierarchy is rooted at `DomainException` on purpose, so
# it stays importable as-is; every concrete error already uses the `Error` suffix.
"src/domain/exceptions.py" = ["N818"]
# `TransactionType(str, Enum)` is kept instead of `StrEnum` because the
# infrastructure layer serialises these members straight to the DRF JSON API.
"src/domain/value_objects.py" = ["UP042"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# A bare `pytest` runs the fast, hermetic suites only. The browser suite is
# opt-in (`make test-e2e`) because Playwright's sync API holds the event loop
# for the whole session, which breaks pytest-asyncio's auto mode; the two cannot
# share a process. tests/e2e/conftest.py explains this to anyone who tries.
testpaths = ["tests/unit", "tests/integration"]
# Keeps `src.*` and `tests.e2e.*` importable no matter which directory pytest
# is invoked from.
pythonpath = ["."]
addopts = "--strict-markers --tb=short"
